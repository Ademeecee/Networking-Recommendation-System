name: CyNam Recommendation System CI

on:
  push:
    branches:
      - main
    paths:
      - "src/**/*.py"
      - "app/**/*.py"
      - "tests/**/*.py"
      - "requirements.txt"
      - ".github/workflows/mlops_pipeline.yml"

  pull_request:
    branches:
      - main
    paths:
      - "src/**/*.py"
      - "app/**/*.py"
      - "tests/**/*.py"
      - "requirements.txt"
      - ".github/workflows/mlops_pipeline.yml"

jobs:
  test:
    name: Test Recommendation System
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Unit Tests
        run: |
          PYTHONPATH=. python -m pytest tests/test_recommender.py -q

      - name: Validate Python Imports
        run: |
          python -c "import src.recommender"
          python -c "import src.clustering"
          python -c "import src.data_pipeline"

      - name: Validate FastAPI Application
        run: |
          python -c "from app.api import app; print('FastAPI application loaded successfully')"